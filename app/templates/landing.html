<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote — Sales Intelligence Hub</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --border: #475569;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { width: 100%; max-width: 560px; padding: 24px; }

        .header { text-align: center; margin-bottom: 32px; }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p { color: var(--text-secondary); font-size: 15px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
        }

        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        label {
            display: block; font-size: 13px; font-weight: 600;
            color: var(--text-secondary); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%; padding: 12px 16px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-primary);
            font-size: 15px; font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea { resize: vertical; min-height: 100px; }

        .btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: #fff; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s; margin-top: 8px;
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .success-msg { display: none; text-align: center; padding: 24px; }
        .success-msg .icon { font-size: 48px; margin-bottom: 12px; }
        .success-msg h2 { color: var(--success); margin-bottom: 8px; }
        .success-msg p { color: var(--text-secondary); }

        .error-msg {
            background: #7f1d1d; color: #fca5a5; padding: 12px 16px;
            border-radius: 8px; margin-bottom: 16px; display: none; font-size: 14px;
        }

        .required::after { content: " *"; color: #ef4444; }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Sales Intelligence Hub</h1>
            <p>Interested in our fleet solutions? Tell us about your needs and we'll get back to you within 24 hours.</p>
        </div>

        <div class="card">
            <div id="error" class="error-msg"></div>

            <form id="leadForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="required">Your Name</label>
                        <input type="text" name="contact_name" required placeholder="John Smith">
                    </div>
                    <div class="form-group">
                        <label class="required">Email</label>
                        <input type="email" name="email" required placeholder="john@company.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" name="company" placeholder="Acme Motors">
                    </div>
                    <div class="form-group">
                        <label>How did you find us?</label>
                        <select name="source">
                            <option value="website">Website</option>
                            <option value="referral">Referral</option>
                            <option value="email">Email Campaign</option>
                            <option value="trade_show">Trade Show</option>
                            <option value="cold_call">Sales Call</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>What are you looking for?</label>
                    <textarea name="inquiry_text" placeholder="Tell us about your fleet needs, budget, timeline, or any questions you have..."></textarea>
                </div>

                <button type="submit" class="btn" id="submitBtn">Submit Inquiry</button>
            </form>

            <div id="success" class="success-msg">
                <div class="icon">✅</div>
                <h2>Thank You!</h2>
                <p>Your inquiry has been received. Our AI is matching you with the best sales rep right now.<br>We'll be in touch within 24 hours.</p>
                <p style="margin-top: 16px; color: var(--text-secondary); font-size: 13px;">
                    Reference: <strong id="leadId"></strong>
                </p>
                <button class="btn" style="margin-top: 20px;" onclick="resetForm()">Submit Another Inquiry</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('leadForm');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const formData = new FormData(form);
            const data = {
                contact_name: formData.get('contact_name'),
                email: formData.get('email'),
                company: formData.get('company') || null,
                source: formData.get('source'),
                inquiry_text: formData.get('inquiry_text') || null
            };

            try {
                const response = await fetch('/leads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('leadId').textContent = `#${result.id}`;
                    form.style.display = 'none';
                    successDiv.style.display = 'block';
                } else {
                    const err = await response.json();
                    errorDiv.textContent = err.detail || 'Submission failed. Please try again.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please check your connection.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Inquiry';
            }
        });

        function resetForm() {
            form.reset();
            form.style.display = 'block';
            successDiv.style.display = 'none';
        }
    </script>
</body>

</html>
